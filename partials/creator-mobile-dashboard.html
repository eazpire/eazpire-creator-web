<div class="creator-dashboard" id="creatorMobileDashboard">
  
  
  <div class="creator-level-row">
    <div class="creator-level-badge" id="creator-mobile-level-root" data-eazy-guide="level">
      <button type="button" class="creator-level-badge__icon creator-journey-trigger" aria-label="Open Creator Journey" data-eazy-guide="chrome.journey-star">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/>
        </svg>
      </button>
      <div class="creator-level-badge__info">
        <span class="creator-level-badge__label" data-t="creator.overview.level_label">Creator Level</span>
        <div class="creator-level-badge__value">
          <span class="creator-level-badge__number" id="creator-mobile-level-num">–</span>
          <span class="creator-level-badge__name" id="creator-mobile-level-name" data-t="creator.overview.loading">Loading...</span>
        </div>
      </div>
      <div class="creator-level-badge__xp">
        <div class="creator-level-badge__xp-bar">
          <div class="creator-level-badge__xp-fill" id="creator-mobile-xp-fill"></div>
        </div>
        <div class="creator-level-badge__xp-info">
          <span class="creator-level-badge__xp-label">XP</span>
          <span class="creator-level-badge__xp-value" id="creator-mobile-xp-value">0 / 50</span>
          <span class="creator-level-badge__xp-hint" id="creator-mobile-xp-hint" data-t="creator.mobile.xp_until_next">Still XP until next level</span>
        </div>
      </div>
    </div>
    <div class="creator-level-share-row">
      <button type="button" class="creator-share-btn creator-share-btn--icon" id="creator-share-btn" aria-label="Share" data-eazy-guide="chrome.share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>
    </div>
  </div>
  

  
    <div class="eazy-dashboard" data-eazy-dashboard data-ed-surface="mobile" data-ed-prefix="creator-mobile" id="creatorDashboardSections">
    <div class="eazy-dashboard__canvas" data-ed-canvas></div>
  </div>
</div>

<div class="eazy-research" data-eazy-research="1">
  <header class="eazy-research__intro">
    <h2 data-t="creator.research.title">eazy Research</h2>
    <p data-t="creator.research.subtitle">Reprint-safe Amazon.de demand signals. Reviews and BSR only — never invented sales.</p>
  </header>

  <div class="eazy-research__banner" data-erz-banner hidden>
    <span data-t="creator.research.preview_banner">Preview data — live snapshots coming</span>
  </div>

  <form class="eazy-research__toolbar" data-erz-toolbar>
    <label class="eazy-research__search">
      <span class="visually-hidden" data-t="creator.research.search_placeholder">Search reprint-safe products</span>
      <input type="search" name="q" autocomplete="off" data-erz-q data-t="creator.research.search_placeholder" placeholder="Search reprint-safe products">
    </label>
    <label class="eazy-research__select">
      <span class="visually-hidden" data-t="creator.research.sort_label">Sort</span>
      <select data-erz-sort>
        <option value="review_growth" data-t="creator.research.sort_review_growth">Review growth</option>
        <option value="reviews" data-t="creator.research.sort_reviews">Reviews</option>
        <option value="bsr" data-t="creator.research.sort_bsr">BSR</option>
        <option value="newest" data-t="creator.research.sort_newest">Newest snapshot</option>
      </select>
    </label>
  </form>

  <div class="eazy-research__chips" data-erz-chips role="list"></div>

  <div class="eazy-research__tabs" data-erz-tabs role="tablist">
    <button type="button" class="is-active" role="tab" aria-selected="true" data-erz-view="opportunities" data-t="creator.research.tab_opportunities">Opportunities</button>
    <button type="button" role="tab" aria-selected="false" data-erz-view="rising" data-t="creator.research.tab_rising">Rising</button>
    <button type="button" role="tab" aria-selected="false" data-erz-view="review_growth" data-t="creator.research.tab_review_growth">Review growth</button>
    <button type="button" role="tab" aria-selected="false" data-erz-view="watched" data-t="creator.research.tab_watched">Watched</button>
  </div>

  <div class="eazy-research__grid-cards" data-erz-grid></div>
  <p class="eazy-research__empty" data-erz-empty hidden></p>

  <footer class="eazy-research__collector" data-erz-status></footer>

  <div class="eazy-research-modal" data-erz-modal hidden>
    <div class="eazy-research-modal__backdrop" data-erz-close></div>
    <div class="eazy-research-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="eazy-research-modal-title">
      <button type="button" class="eazy-research-modal__close" data-erz-close aria-label="Close product">×</button>
      <div data-erz-detail></div>
    </div>
  </div>
</div>

<dialog class="design-canvas-modal" id="creator-design-canvas-modal" aria-labelledby="design-canvas-modal-title">
  <div class="design-canvas-modal__chrome">
    <header class="design-canvas-modal__header">
      <div class="design-canvas-modal__header-copy">
        <h2 id="design-canvas-modal-title" class="design-canvas-modal__title" data-t="creator.my_creations.canvas_title">Canvas</h2>
        <p class="design-canvas-modal__meta" data-t="creator.my_creations.canvas_size_meta">4500 × 4500 px · transparent PNG</p>
      </div>
      <button type="button" class="design-canvas-modal__icon-btn" id="design-canvas-modal-close" data-t="creator.my_creations.canvas_close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="design-canvas-modal__body">
      <aside class="design-canvas-modal__tools" aria-label="Add Text">
        <button type="button" class="design-canvas-modal__tool is-active" data-canvas-tool="text" title="Add Text">T</button>
        <span class="design-canvas-modal__tool-label" data-t="creator.my_creations.canvas_tool_text">Text</span>
        <span class="design-canvas-modal__tools-rule" aria-hidden="true"></span>
        <span class="design-canvas-modal__tool is-muted" title="Draw" data-t="creator.my_creations.canvas_tool_draw">Draw</span>
        <span class="design-canvas-modal__tool is-muted" title="Shape" data-t="creator.my_creations.canvas_tool_shape">Shape</span>
        <span class="design-canvas-modal__tool is-muted" title="Image" data-t="creator.my_creations.canvas_tool_image">Image</span>
      </aside>

      <div class="design-canvas-modal__viewer">
        <div class="design-canvas-modal__stage" id="design-canvas-stage">
          <div class="design-canvas-modal__print-frame" aria-hidden="true"></div>
          <div class="design-canvas-modal__text-wrap" id="design-canvas-text-wrap" data-align="center">
            <div class="design-canvas-modal__text is-placeholder" id="design-canvas-text" data-t="creator.my_creations.canvas_text_placeholder">Your text</div>
          </div>
          <span class="design-canvas-modal__print-label" data-t="creator.my_creations.canvas_print_area">Print area</span>
        </div>
      </div>

      <aside class="design-canvas-modal__inspector">
        <h3 class="design-canvas-modal__inspector-title" data-t="creator.my_creations.canvas_add_text">Add Text</h3>
        <label class="design-canvas-modal__field">
          <span data-t="creator.my_creations.canvas_text_label">Text</span>
          <input type="text" id="design-canvas-text-input" maxlength="180" autocomplete="off" placeholder="Your text">
        </label>
        <label class="design-canvas-modal__field">
          <span data-t="creator.my_creations.canvas_font">Font</span>
          <select id="design-canvas-font">
            <option value="arial" data-family="Arial, Helvetica, sans-serif">Arial</option>
            <option value="impact" data-family="Impact, Haettenschweiler, sans-serif" selected>Impact</option>
            <option value="georgia" data-family="Georgia, 'Times New Roman', serif">Georgia</option>
            <option value="times" data-family="'Times New Roman', Times, serif">Times</option>
            <option value="verdana" data-family="Verdana, Geneva, sans-serif">Verdana</option>
            <option value="trebuchet" data-family="'Trebuchet MS', sans-serif">Trebuchet</option>
            <option value="courier" data-family="'Courier New', Courier, monospace">Courier</option>
            <option value="palatino" data-family="'Palatino Linotype', Palatino, serif">Palatino</option>
          </select>
        </label>
        <label class="design-canvas-modal__field">
          <span data-t="creator.my_creations.canvas_size">Size</span>
          <select id="design-canvas-size">
            <option value="32">32 — Small</option>
            <option value="48">48 — Medium</option>
            <option value="64">64 — Large</option>
            <option value="88" selected>88 — Poster</option>
            <option value="120">120 — Statement</option>
          </select>
        </label>
        <div class="design-canvas-modal__field">
          <span data-t="creator.my_creations.canvas_align">Align</span>
          <div class="design-canvas-modal__align" role="group">
            <button type="button" class="design-canvas-modal__align-btn" data-align="left" data-t="creator.my_creations.canvas_align_left">Left</button>
            <button type="button" class="design-canvas-modal__align-btn is-active" data-align="center" data-t="creator.my_creations.canvas_align_center">Center</button>
            <button type="button" class="design-canvas-modal__align-btn" data-align="right" data-t="creator.my_creations.canvas_align_right">Right</button>
          </div>
        </div>
        <div class="design-canvas-modal__field">
          <span data-t="creator.my_creations.canvas_color">Color</span>
          <div class="design-canvas-modal__swatches" id="design-canvas-swatches">
            <button type="button" class="design-canvas-modal__swatch is-active" data-color-id="white" data-hex="#F8FAFC" title="White" style="background:#F8FAFC"></button>
            <button type="button" class="design-canvas-modal__swatch" data-color-id="black" data-hex="#111827" title="Black" style="background:#111827"></button>
            <button type="button" class="design-canvas-modal__swatch" data-color-id="red" data-hex="#DC2626" title="Red" style="background:#DC2626"></button>
            <button type="button" class="design-canvas-modal__swatch" data-color-id="navy" data-hex="#1E3A8A" title="Navy" style="background:#1E3A8A"></button>
            <button type="button" class="design-canvas-modal__swatch" data-color-id="gold" data-hex="#F59E0B" title="Gold" style="background:#F59E0B"></button>
            <button type="button" class="design-canvas-modal__swatch" data-color-id="teal" data-hex="#0D9488" title="Teal" style="background:#0D9488"></button>
            <button type="button" class="design-canvas-modal__swatch" data-color-id="pink" data-hex="#DB2777" title="Pink" style="background:#DB2777"></button>
            <button type="button" class="design-canvas-modal__swatch" data-color-id="cream" data-hex="#F5E6C8" title="Cream" style="background:#F5E6C8"></button>
          </div>
          <p class="design-canvas-modal__color-name" id="design-canvas-color-name">White</p>
        </div>
        <p class="design-canvas-modal__later" data-t="creator.my_creations.canvas_later_tools">Later: drag to move, more lines, outline, curve. Not in this first version.</p>
      </aside>
    </div>

    <footer class="design-canvas-modal__footer">
      <button type="button" class="design-canvas-modal__btn" id="design-canvas-modal-cancel" data-t="creator.my_creations.canvas_cancel">Cancel</button>
      <button type="button" class="design-canvas-modal__btn design-canvas-modal__btn--primary" id="design-canvas-modal-use" disabled data-t="creator.my_creations.canvas_use">Use as design</button>
    </footer>
  </div>
</dialog>
